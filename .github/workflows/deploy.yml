name: deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Bicep CLI
        run: |
          curl -fsSL https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64 -o /tmp/bicep
          chmod +x /tmp/bicep
          sudo mv /tmp/bicep /usr/local/bin/bicep
      - run: az deployment group create --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --template-file infra/main.bicep --parameters @infra/main.parameters.example.json
